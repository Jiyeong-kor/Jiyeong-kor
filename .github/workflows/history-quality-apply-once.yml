name: 한능검 품질 개편 자산 적용

on:
  push:
    branches:
      - agent/history-question-quality-v3
    paths:
      - ".github/workflows/history-quality-apply-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history-quality-apply-v3
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 작업 브랜치 체크아웃
        uses: actions/checkout@v4
        with:
          ref: agent/history-question-quality-v3

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 품질 개편 자산 복원과 검증
        shell: bash
        run: |
          cat .history-quality-upload/part-*.b64 | base64 --decode > /tmp/history-quality-v3.tar.gz
          echo "9aab84c37c1da95c4342305f1d99bb27dfa8bb2b647e6b6a6336b1e0cab40bf1  /tmp/history-quality-v3.tar.gz" | sha256sum --check -
          tar -xzf /tmp/history-quality-v3.tar.gz
          node --check docs/history/data.js
          node --check docs/history/app.js
          node scripts/verify_history_site.mjs

      - name: 검증된 자산 커밋
        shell: bash
        run: |
          rm -rf .history-quality-upload
          rm -f .github/workflows/history-quality-apply-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 한능검 문제 품질과 검증 체계 개편"
          git push origin HEAD:agent/history-question-quality-v3
