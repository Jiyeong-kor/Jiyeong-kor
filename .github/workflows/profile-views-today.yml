name: 오늘 프로필 조회수 갱신

on:
  schedule:
    # UTC 15:00은 한국 시간 다음 날 00:00입니다.
    - cron: '0 15 * * *'
    # 자정 실행이 지연되거나 누락되면 재시도합니다. 같은 날짜에는 수정하지 않습니다.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-views-today.yml
      - scripts/update_profile_views.py

permissions:
  contents: write

concurrency:
  group: profile-views-today
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 최신 프로필 소스 확인
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 한국 날짜별 조회 배지 갱신
        run: python3 scripts/update_profile_views.py

      - name: 변경된 배지만 저장
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'chore: 한국 날짜별 프로필 조회수 배지 갱신'
          git push origin HEAD:main
