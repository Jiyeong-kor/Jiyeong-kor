name: 프로필 활동 이미지 갱신

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-visuals.yml
      - scripts/generate_profile_activity.py
      - scripts/render_profile_assets.py
      - scripts/render_profile_copy.py
      - assets/profile/pink/**
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 소스 확인
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pretendard 폰트 설치
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/orioncactus/pretendard/main/packages/pretendard/dist/public/static/Pretendard-Bold.otf \
            --output "$HOME/.local/share/fonts/Pretendard-Bold.otf"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/orioncactus/pretendard/main/packages/pretendard/dist/public/static/Pretendard-Black.otf \
            --output "$HOME/.local/share/fonts/Pretendard-Black.otf"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/orioncactus/pretendard/main/packages/pretendard/dist/public/static/Pretendard-Regular.otf \
            --output "$HOME/.local/share/fonts/Pretendard-Regular.otf"
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match Pretendard

      - name: Pretendard 본문과 소개 이미지 생성
        run: |
          python -m pip install 'CairoSVG==2.7.1'
          python scripts/render_profile_assets.py
          python scripts/render_profile_copy.py

      - name: 실제 GitHub 기여 기록으로 활동 그래프 생성
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_activity.py

      - name: 실제 GitHub 기여 기록으로 보라색 Snake 생성
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Jiyeong-kor
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake-purple.svg?color_snake=#9B67BC&color_dots=#FBF7FE,#F2E7F8,#E4C8F1,#CC9CE3,#9B67BC

      - name: 생성된 결과 검사
        run: |
          test -s dist/about-purple.png
          test -s dist/activity-purple.svg
          test -s dist/activity-purple.png
          test -s dist/snake-purple.svg
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          from PIL import Image
          images = list(Path("dist").glob("*.png"))
          assert len(images) == 19, len(images)
          for image in images:
              with Image.open(image) as png:
                  png.verify()
          for p in (Path('dist/activity-purple.svg'), Path('dist/snake-purple.svg')):
              ElementTree.parse(p)
              print('XML 확인:', p)
          PY

      - name: 프로필 전용 출력 브랜치 게시
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: profile-assets
          build_dir: dist
          commit_message: 'chore: GitHub 기여 이미지 자동 갱신'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
