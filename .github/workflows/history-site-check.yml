name: 한능검 사이트 검증

on:
  pull_request:
    paths:
      - "docs/history/**"
      - "apps/korean-history-study/**"
      - "scripts/verify_history_site.mjs"
      - ".history-quality-upload/**"
      - ".github/workflows/history-quality-apply-once.yml"
      - ".github/workflows/history-site-check.yml"
  push:
    branches:
      - main
    paths:
      - "docs/history/**"
      - "apps/korean-history-study/**"
      - "scripts/verify_history_site.mjs"
      - ".github/workflows/history-site-check.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 작업 브랜치 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 2

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 품질 개편 자산 적용
        shell: bash
        run: |
          if ! compgen -G ".history-quality-upload/part-*.b64" > /dev/null; then
            exit 0
          fi
          cat .history-quality-upload/part-*.b64 | base64 --decode > /tmp/history-quality-v3.tar.gz
          echo "9aab84c37c1da95c4342305f1d99bb27dfa8bb2b647e6b6a6336b1e0cab40bf1  /tmp/history-quality-v3.tar.gz" | sha256sum --check -
          tar -xzf /tmp/history-quality-v3.tar.gz
          rm -rf .history-quality-upload
          rm -f .github/workflows/history-quality-apply-once.yml
          git fetch -q origin main
          git checkout origin/main -- .github/workflows/history-site-check.yml

      - name: 한능검 학습 사이트 검증
        run: |
          node --check docs/history/data.js
          node --check docs/history/app.js
          node scripts/verify_history_site.mjs

      - name: 검증된 품질 개편 자산 커밋
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 한능검 문제 품질과 검증 체계 개편"
          git push origin HEAD:${{ github.head_ref }}
