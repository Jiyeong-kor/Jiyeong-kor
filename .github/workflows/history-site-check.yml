name: 한능검 사이트 검증

on:
  pull_request:
    paths:
      - "docs/history/**"
      - "apps/korean-history-study/**"
      - "scripts/verify_history_site.mjs"
      - ".repair/**"
      - ".github/workflows/history-site-check.yml"
  push:
    branches:
      - main
    paths:
      - "docs/history/**"
      - "apps/korean-history-study/**"
      - "scripts/verify_history_site.mjs"
      - ".github/workflows/history-site-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: history-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 복구 대상 자산을 작업 공간에 적용
        shell: bash
        run: |
          if ! compgen -G ".repair/history-site-part-*.b64" > /dev/null; then
            exit 0
          fi
          cat .repair/history-site-part-*.b64 | base64 --decode > /tmp/history-site.tar.gz
          echo "f15ee952a69c38d0e3c583710e832b9e592b908ef1672e6b9d8689ef2e3fd834  /tmp/history-site.tar.gz" | sha256sum --check -
          tar -xzf /tmp/history-site.tar.gz
          rm -rf docs/history/payload

      - name: 한능검 학습 사이트 검증
        run: node scripts/verify_history_site.mjs
