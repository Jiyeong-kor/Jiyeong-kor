name: 한능검 사이트 검증

on:
  pull_request:
    paths:
      - "docs/history/**"
      - "apps/korean-history-study/**"
      - "scripts/verify_history_site.mjs"
      - ".github/workflows/history-site-check.yml"
  push:
    branches:
      - main
    paths:
      - "docs/history/**"
      - "apps/korean-history-study/**"
      - "scripts/verify_history_site.mjs"
      - ".github/workflows/history-site-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: history-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 체크아웃
        shell: bash
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch -q --depth=1 origin "+refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/origin/pr-merge"
            git checkout -q refs/remotes/origin/pr-merge
          else
            git fetch -q --depth=1 origin "${GITHUB_SHA}"
            git checkout -q FETCH_HEAD
          fi

      - name: 한능검 학습 사이트 검증
        shell: bash
        run: |
          set +e
          output="$(node scripts/verify_history_site.mjs 2>&1)"
          status=$?
          printf '%s\n' "$output" | tail -n 80
          exit "$status"
