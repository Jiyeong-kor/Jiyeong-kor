name: 한능검 사이트 자산 복구

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".repair/**"
      - ".github/workflows/history-site-repair-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history-site-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 작업 브랜치 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'ci/history-site-repair' }}

      - name: 손상된 압축 자산을 정적 파일로 교체
        shell: bash
        run: |
          if ! compgen -G ".repair/history-site-part-*.b64" > /dev/null; then
            echo "복구 조각이 없어서 변경하지 않습니다."
            exit 0
          fi
          cat .repair/history-site-part-*.b64 | base64 --decode > /tmp/history-site.tar.gz
          echo "f15ee952a69c38d0e3c583710e832b9e592b908ef1672e6b9d8689ef2e3fd834  /tmp/history-site.tar.gz" | sha256sum --check -
          tar -xzf /tmp/history-site.tar.gz
          rm -rf docs/history/payload
          node scripts/verify_history_site.mjs

      - name: 복구 결과 커밋
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md apps/korean-history-study scripts/verify_history_site.mjs
          git add -A docs/history
          if git diff --cached --quiet; then
            echo "이미 복구된 상태입니다."
            exit 0
          fi
          git commit -m "fix: 한능검 정적 자산 손상 복구"
          git push origin HEAD:${{ github.head_ref || 'ci/history-site-repair' }}
