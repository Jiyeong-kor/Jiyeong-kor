<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>React Native 학습 자료 불러오는 중</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b1020;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.card{width:min(100%,430px);padding:25px;border:1px solid #29334d;border-radius:22px;background:#111827}h1{margin:0 0 8px;font-size:1.35rem}p{margin:0;color:#b8c2d5;line-height:1.6}.bar{height:8px;margin-top:20px;border-radius:999px;overflow:hidden;background:#27324a}.bar i{display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#8b7cff,#42c9d6);animation:m 1s ease-in-out infinite alternate}@keyframes m{to{transform:translateX(138%)}}button{display:none;width:100%;min-height:48px;margin-top:16px;border:0;border-radius:13px;background:#7567ff;color:white;font:inherit;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <h1>React Native 학습 자료를 불러오고 있습니다.</h1>
    <p id="status">모바일 학습 페이지를 준비하고 있습니다.</p>
    <div class="bar" id="bar"><i></i></div>
    <button id="retry" type="button">다시 불러오기</button>
  </main>
  <script>
    async function load() {
      const status = document.querySelector('#status');
      const retry = document.querySelector('#retry');
      const bar = document.querySelector('#bar');
      retry.style.display = 'none';
      bar.style.display = 'block';
      status.textContent = '모바일 학습 페이지를 준비하고 있습니다.';

      try {
        if (!('DecompressionStream' in window)) {
          throw new Error('현재 Safari 버전에서는 압축 해제를 지원하지 않습니다. Safari를 최신 버전으로 업데이트해 주세요.');
        }

        const response = await fetch('./app.gz.b64?v=3', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error('학습 파일을 불러오지 못했습니다.');
        }

        const raw = await response.text();
        const normalized = raw
          .replace(/-/g, '+')
          .replace(/_/g, '/')
          .replace(/[^A-Za-z0-9+/=]/g, '')
          .replace(/=+$/g, '');

        if (!normalized) {
          throw new Error('학습 파일이 비어 있습니다.');
        }

        const padded = normalized + '='.repeat((4 - normalized.length % 4) % 4);
        const binary = atob(padded);
        const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
        const stream = new Response(bytes).body.pipeThrough(new DecompressionStream('gzip'));
        const html = await new Response(stream).text();

        if (!html.trim().toLowerCase().startsWith('<!doctype html') && !html.trim().toLowerCase().startsWith('<html')) {
          throw new Error('학습 파일의 형식이 올바르지 않습니다.');
        }

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        bar.style.display = 'none';
        status.textContent = error && error.message ? error.message : '네트워크 연결을 확인해 주세요.';
        retry.style.display = 'block';
      }
    }

    document.querySelector('#retry').addEventListener('click', load);
    load();
  </script>
</body>
</html>
