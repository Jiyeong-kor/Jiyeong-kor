<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>React Native 학습 자료 불러오는 중</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b1020;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.card{width:min(100%,430px);padding:25px;border:1px solid #29334d;border-radius:22px;background:#111827}h1{margin:0 0 8px;font-size:1.35rem}p{margin:0;color:#b8c2d5;line-height:1.6}.bar{height:8px;margin-top:20px;border-radius:999px;overflow:hidden;background:#27324a}.bar i{display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#8b7cff,#42c9d6);animation:m 1s ease-in-out infinite alternate}@keyframes m{to{transform:translateX(138%)}}button{display:none;width:100%;min-height:48px;margin-top:16px;border:0;border-radius:13px;background:#7567ff;color:white;font:inherit;font-weight:800}</style></head><body><main class="card"><h1>React Native 학습 자료를 불러오고 있습니다.</h1><p id="status">모바일 학습 페이지를 준비하고 있습니다.</p><div class="bar" id="bar"><i></i></div><button id="retry">다시 불러오기</button></main><script>async function load(){const s=document.querySelector('#status'),r=document.querySelector('#retry');r.style.display='none';document.querySelector('#bar').style.display='block';try{if(!('DecompressionStream'in window))throw new Error('현재 브라우저가 압축 해제를 지원하지 않습니다. Safari를 최신 버전으로 업데이트해 주세요.');const t=(await fetch('./app.gz.b64',{cache:'no-cache'}));if(!t.ok)throw new Error('학습 파일을 불러오지 못했습니다.');const b=atob((await t.text()).replace(/\s/g,'')),u=Uint8Array.from(b,c=>c.charCodeAt(0)),z=new Response(u).body.pipeThrough(new DecompressionStream('gzip')),h=await new Response(z).text();document.open();document.write(h);document.close()}catch(e){document.querySelector('#bar').style.display='none';s.textContent=e.message||'네트워크 연결을 확인해 주세요.';r.style.display='block'}}document.querySelector('#retry').onclick=load;load()</script></body></html>
