<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="description" content="한국사능력검정시험 심화 1급 대비 개념·예상 문제·오답 복습·실전 모의고사 웹사이트입니다.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>한능검 1급 훈련소 불러오는 중</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f5f1e8; color: #20211f; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height: 1.6; }
    .card { width: min(100%, 460px); padding: 28px; border: 1px solid #d9d1c1; border-radius: 22px; background: #fffdf8; box-shadow: 0 12px 30px rgba(65,49,29,.09); }
    .mark { display: grid; width: 48px; height: 48px; margin-bottom: 16px; place-items: center; border-radius: 14px; background: #7a2f35; color: #fff; font: 800 1.4rem Georgia, serif; }
    h1 { margin: 0 0 8px; font-size: 1.4rem; } p { margin: 0; color: #65675f; }
    .bar { height: 8px; margin-top: 20px; overflow: hidden; border-radius: 999px; background: #ebe4d5; }
    .bar span { display: block; width: 42%; height: 100%; border-radius: inherit; background: #7a2f35; animation: move 1s ease-in-out infinite alternate; }
    @keyframes move { to { transform: translateX(138%); } }
    button { display: none; width: 100%; min-height: 48px; margin-top: 18px; border: 0; border-radius: 12px; background: #7a2f35; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">史</div>
    <h1>한능검 1급 훈련소를 불러오고 있습니다.</h1>
    <p id="status">2,200개 예상 문제와 학습 기록 기능을 준비하고 있습니다.</p>
    <div class="bar" id="bar" aria-hidden="true"><span></span></div>
    <button id="retry" type="button">다시 불러오기</button>
  </main>
  <script>
    const PARTS = ["./payload/part-01.gz.b64?v=20260726-1", "./payload/part-02.gz.b64?v=20260726-1", "./payload/part-03.gz.b64?v=20260726-1", "./payload/part-04.gz.b64?v=20260726-1"];
    async function loadApp() {
      const status = document.getElementById('status');
      const retry = document.getElementById('retry');
      retry.style.display = 'none';
      document.getElementById('bar').style.display = 'block';
      status.textContent = '학습 자료를 불러오고 있습니다.';
      try {
        if (!('DecompressionStream' in window)) throw new Error('현재 브라우저는 학습 자료 압축 해제를 지원하지 않습니다. Chrome, Edge, Safari 또는 Firefox의 최신 버전을 사용해 주세요.');
        const responses = await Promise.all(PARTS.map(path => fetch(path, { cache: 'no-cache' })));
        if (responses.some(response => !response.ok)) throw new Error('학습 자료를 불러오지 못했습니다.');
        const encoded = (await Promise.all(responses.map(response => response.text()))).join('').replace(/\s/g, '');
        const binary = atob(encoded);
        const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
        const stream = new Response(bytes).body.pipeThrough(new DecompressionStream('gzip'));
        const html = await new Response(stream).text();
        document.open(); document.write(html); document.close();
      } catch (error) {
        document.getElementById('bar').style.display = 'none';
        status.textContent = error?.message || '네트워크 연결을 확인한 뒤 다시 시도해 주세요.';
        retry.style.display = 'block';
      }
    }
    document.getElementById('retry').addEventListener('click', loadApp);
    loadApp();
  </script>
</body>
</html>
