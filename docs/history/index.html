        const after = decodePatch(encodedAfter);
        if (current.includes(before)) return current.replace(before, after);
        return current;
      }, source);

        if (responses.some(response => !response.ok)) throw new Error('학습 자료를 불러오지 못했습니다.');

        const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
        const stream = new Response(bytes).body.pipeThrough(new DecompressionStream('gzip'));
        const html = applyCorrections(await new Response(stream).text());
        document.open(); document.write(html); document.close();
      } catch (error) {
        document.getElementById('bar').style.display = 'none';

        retry.style.display = 'block';
      }
    }
